<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>siromegane-paper-library</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>しろめがね 論文ライブラリ</h1>
  <div id="status" class="status">確認中…</div>
</header>

<nav class="tabs">
  <button data-tab="search" class="active">探す</button>
  <button data-tab="library">保存した論文</button>
  <button data-tab="doc">この原稿の引用</button>
</nav>

<section id="tab-search" class="tab active">
  <form id="search-form">
    <input id="q" type="search" placeholder="例：ECMO hemolysis ／ 人工心肺" required>
    <div class="row">
      <label><input type="checkbox" id="src-pubmed" checked> PubMed</label>
      <label><input type="checkbox" id="src-jstage" checked> J-STAGE</label>
      <button type="submit">検索</button>
    </div>
  </form>
  <p class="hint">PubMedは英語、J-STAGEは日本語の語句で探します。AIで日本語から検索式を作る機能は、次の版で足します。</p>
  <ul id="results" class="list"></ul>
</section>

<section id="tab-library" class="tab">
  <form id="lib-form" class="row">
    <input id="lib-q" type="search" placeholder="題名・著者・年で絞る">
    <button type="submit">表示</button>
  </form>
  <ul id="library" class="list"></ul>
</section>

<section id="tab-doc" class="tab">
  <div class="row">
    <button id="read-doc">原稿の引用を読む</button>
  </div>
  <p class="hint">引用を差し込んだあとは、Wordの「Zotero」タブの「Refresh」を押すと、引用の形が整います。</p>
  <ul id="doc-cites" class="list"></ul>
</section>

<footer id="log" class="log"></footer>
<script src="app.js"></script>
</body>
</html>
